site_name: Enum2Root
site_description: Carte de méthodologie de pentest interactive - référence complète avec liens externes vérifiés (HackTricks, PayloadsAllTheThings, GTFOBins…).
site_url: https://enum2root.readthedocs.io/
repo_url: https://github.com/cchopin/Enum2Root
repo_name: cchopin/Enum2Root
docs_dir: docs

theme:
  name: material
  language: fr
  icon:
    logo: material/lan-connect
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Thème clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Thème sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_description: Interactive pentest methodology map - full reference with verified external links (HackTricks, PayloadsAllTheThings, GTFOBins…).
          nav_translations:
            Accueil: Home
            Guide: Guide
            Démarrage rapide: Quick start
            Fonctionnalités: Features
            Statuts & RAZ: Status & RAZ
            Méthodologie: Methodology
            Outils: Tools
            Référence: Reference
            Vue d'ensemble: Overview
            "1 - Énumération des services (1/2)": "1 - Service enumeration (1/2)"
            "1 - Énumération des services (2/2)": "1 - Service enumeration (2/2)"
            "2 - Attaques web": "2 - Web attacks"
            "5 - Shells, transfert & pivot": "5 - Shells, transfer & pivot"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Guide:
      - Démarrage rapide: demarrage.md
      - Fonctionnalités: fonctionnalites.md
      - Statuts & RAZ: statuts-et-raz.md
      - Méthodologie: methodologie.md
  - Outils: outils.md
  - Référence:
      - Vue d'ensemble: reference/index.md
      - 0 - Reconnaissance: reference/reconnaissance.md
      - 1 - Énumération des services (1/2): reference/enumeration-1.md
      - 1 - Énumération des services (2/2): reference/enumeration-2.md
      - 2 - Attaques web: reference/web.md
      - 3 - Active Directory: reference/active-directory.md
      - 4 - Post-exploitation: reference/post-exploitation.md
      - 5 - Shells, transfert & pivot: reference/shells-pivot.md
